name: Verify Commit & Safety Check

'on':
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  safety-check:
    name: Run Safety Verification
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the latest commit in the repository
      - name: Checkout latest commit
        uses: actions/checkout@v4

      # Step 2: Set up Python runtime
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Step 4: Verify Python syntax across codebase
      - name: Check Python syntax
        run: |
          python -m compileall backend test_import.py

      # Step 5: Run the basic verification script to determine if it is safe
      - name: Run verification script
        run: |
          python test_import.py
